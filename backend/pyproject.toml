[project]
name = "bazaar-backend"
version = "0.1.0"
description = "FastAPI backend for the Bazaar storefront"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "email-validator>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "PyJWT>=2.0,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
