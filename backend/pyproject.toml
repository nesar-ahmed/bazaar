[project]
name = "bazaar-backend"
version = "0.1.0"
description = "FastAPI backend for the Bazaar storefront"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
